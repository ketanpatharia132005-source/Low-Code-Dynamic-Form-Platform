# A generic, single database configuration for Alembic.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, space-separated, to search for modules when importing env.py
prepend_sys_path = .

# timezone to use when rendering dates within the migration file
# timezone =

# limit the number of times we retry after a transaction lock failure
# max_transaction_retries = 5

[logging]
default_level = INFO
